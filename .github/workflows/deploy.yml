name: Deploy to Gigalixir

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to Gigalixir
        uses: gigalixir/gigalixir-action@v0
        with:
          GIGALIXIR_USERNAME: ${{ secrets.GIGALIXIR_EMAIL }}
          GIGALIXIR_PASSWORD: ${{ secrets.GIGALIXIR_API_KEY }}
          GIGALIXIR_APP: godswheel
          MIGRATIONS: false
          SSH_PRIVATE_KEY: ${{ secrets.GIGALIXIR_SSH_PRIVATE_KEY }}

  migrate:
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Install Gigalixir CLI
        run: |
          curl -fsSL https://get.gigalixir.com/cli | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          gigalixir version

      - name: Configure Gigalixir authentication
        env:
          GIGALIXIR_EMAIL: ${{ secrets.GIGALIXIR_EMAIL }}
          GIGALIXIR_API_KEY: ${{ secrets.GIGALIXIR_API_KEY }}
        run: |
          cat > "$HOME/.netrc" <<EOF
          machine api.gigalixir.com
            login ${GIGALIXIR_EMAIL}
            password ${GIGALIXIR_API_KEY}
          EOF
          chmod 600 "$HOME/.netrc"

      - name: Configure SSH identity
        env:
          GIGALIXIR_SSH_PRIVATE_KEY: ${{ secrets.GIGALIXIR_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$GIGALIXIR_SSH_PRIVATE_KEY" > "$HOME/.ssh/gigalixir"
          chmod 600 "$HOME/.ssh/gigalixir"
          echo "GIGALIXIR_IDENTITY_FILE=$HOME/.ssh/gigalixir" >> "$GITHUB_ENV"

      - name: Run database migrations
        run: gigalixir ps:migrate -a godswheel
